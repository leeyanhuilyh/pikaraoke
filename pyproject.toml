[project]
name = "pikaraoke"
version = "1.23.0"
description = "Youtube-based Karaoke machine for Raspberry Pi, OSX, Windows, and Linux"
authors = [{name = "Vic Wong"}]
readme = "docs/README.md"
requires-python = ">=3.10"
keywords = ["karaoke", "ktv", "video", "audio", "youtube", "raspberry-pi", "osx", "windows", "linux"]
classifiers = [
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Games/Entertainment"
]
dependencies = [
  "Flask>=3.1.3,<4",
  "qrcode[png]>=8.2,<9",
  "psutil>=7.2.1,<8",
  "requests>=2.32.5,<3",
  "flask-paginate>=2024.4.12",
  "flask-smorest>=0.46.0",
  "Babel>=2.17.0,<3",
  "Flask-Babel>=4.0.0,<5",
  "ffmpeg-python>=0.2.0,<1",
  "yt-dlp[default]>=2026.07.04",
  "flask-socketio>=5.6.1",  # 5.6.1 stops assigning to Flask 3.1.3's read-only session
  "gevent>=24.11.1",
  "sounddevice>=0.5.0; sys_platform != 'linux'",
]

# The vendored fork, not PyPI's demucs. Resolves torch by platform on its own:
# the CUDA build on x86_64 Linux/Windows, CPU/MPS wheels on aarch64 (Pi) and macOS.
[tool.uv.sources]
demucs = { path = "vendor/demucs", editable = true }

[tool.uv]
# A default group rather than a project dependency: `uv run` installs it, so
# vocal separation works out of the box, but torch stays out of the Docker
# image, the Windows installer and a plain `pip install pikaraoke`, none of
# which ship the vendor/ submodule it is built from.
default-groups = ["dev", "vocal-separation"]
# Intel macOS is left out of the resolution deliberately. torch published no
# wheels for it after 2.2, so demucs pins torch<2.3 there, and a universal
# resolution would hold every other platform back to a torch too old to have
# wheels for the Python this project runs on.
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",

]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pylint>=4.0.7",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
vocal-separation = [
    "demucs",
]
translations = [
    "deep-translator>=1.11.4",
    "polib>=1.2.0",
]

[project.scripts]
pikaraoke = "pikaraoke.app:main"

[project.urls]
Homepage = "https://github.com/vicwomg/pikaraoke"
Repository = "https://github.com/vicwomg/pikaraoke"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pikaraoke"]

# Poetry-specific configuration (reads from [project] above)
[tool.poetry]
package-mode = true

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7.1"

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
ignore = ["src/oldstuff"]
defineConstant = { DEBUG = true }
stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.10"
pythonPlatform = "Linux"

[tool.coverage.run]
omit = [
    "pikaraoke/constants.py",
    "pikaraoke/app.py",
    "pikaraoke/lib/current_app.py",
    "pikaraoke/lib/args.py",
]
